# Per-module settings (shipped defaults).
#
# Override in ~/.config/aiszx/modules.yaml, or per engagement in
# <data>/engagements/<engagement>/overrides.yaml under a `modules:` key.
#
#   modules:
#     <module id>:
#       enabled: true|false
#       timeout: <seconds>
#       retry: {max_attempts: 2, backoff_seconds: 5}
#       options: {...}            # module-specific; see `python3 pentest.py modules show <id>`
#
# Changing a module's options changes its configuration fingerprint, so `resume`
# re-runs it instead of reusing old results.
version: 1

modules:
  core.connectivity:
    options:
      count: 2
      wait_seconds: 2

  # --- HTTP (Milestone 5) -------------------------------------------------------
  # Common to the http.* modules:
  #   vhosts:          extra virtual hosts to present (also `enumerate --vhost NAME`)
  #   skip_categories: service categories never treated as websites (default: [winrm])
  #
  # http.probe:             user_agent, timeout (s), paths (default [/robots.txt, /sitemap.xml])
  # http.whatweb:           aggression (1 = stealthy, 3 = aggressive), user_agent
  # http.screenshots:       timeout (s), threads
  # http.content_discovery: wordlists (first existing is used), threads, depth, extensions,
  #                         time_limit (feroxbuster syntax, e.g. 10m), tool (auto|feroxbuster|gobuster)
  # http.nikto:             max_time (e.g. 15m), tuning (Nikto -Tuning letters)
  #
  # Example:
  #   http.content_discovery:
  #     options:
  #       wordlists: [/usr/share/seclists/Discovery/Web-Content/raft-medium-words.txt]
  #       extensions: [php, txt]
  #       time_limit: 20m

  # --- Service enumeration (Milestone 6) ----------------------------------------
  # No module guesses credentials. Anonymous/null/guest checks are single, standard attempts.
  #
  # smb.netexec:        null_session_check (true), guest_check (true)
  # dns.dig:            domains (extra domains to query), max_domains (3), zone_transfer (true)
  #                     Domains are also learned from LDAP/SMB results of the same run, the target
  #                     hostname and --vhost names.
  # ldap.anonymous:     size_limit (100) for the anonymous subtree query
  # nse.service_info:   scripts: {category: [nse-script, ...]}. Only information scripts are accepted;
  #                     names containing brute/dos/exploit/fuzz/flood/vuln/backdoor/-enum-users are refused.
  # snmp.walk:          communities: AUTHORISED community strings only (secret: masked in run records);
  #                     without them the module is skipped. Example, per engagement in overrides.yaml:
  #   modules:
  #     snmp.walk:
  #       options:
  #         communities: ["the-string-you-were-given"]

  # --- Coverage expansion (Milestone 10) -----------------------------------------
  # Still no credential use, no user enumeration, no brute force of anything but host names.
  #
  # http.vhost_discovery: wordlists (first existing is used), threads (20), max_time (s, 300), rate (req/s, 0 = no
  #                       limit, ffuf only), max_domains (3), tool (auto|ffuf|gobuster). Base domains are the target
  #                       hostname, accepted virtual hosts (`hints accept`) and --vhost names. active_noisy.
  # dns.ad_srv:           domains, max_domains (2). SRV lookups for DCs, Kerberos and the global catalog.
  # dns.dnsrecon:         domains, max_domains (2), lifetime (s). Standard records only (-t std), DNS on port 53.
  # rpc.endpoints:        anonymous endpoint-mapper listing on 135/593 (impacket rpcdump).
  # elasticsearch.info:   timeout (s). GET / and /_cat/indices only.
  # nse.service_info also covers redis, mongodb, memcached, rsync and docker (information scripts).
