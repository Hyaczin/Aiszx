# Execution profiles (shipped defaults). Override in ~/.config/aiszx/profiles.yaml
# or per engagement in <data>/engagements/<e>/overrides.yaml under `profiles:`.
#
# max_safety: most aggressive module safety class a profile runs automatically
#   passive < active_safe < active_noisy < intrusive
# Modules above the ceiling are SKIPPED with the reason recorded. "intrusive" modules
# additionally need explicit approval every run (interactive prompt or --approve <module>).
# An engagement's rules of engagement (`engagement update --max-safety`) can lower it further.
#
# nmap: scan parameters for the reconnaissance modules (all keys optional):
#   timing            -T value (0-5)
#   discovery_probes  host discovery probes; only -P... flags are accepted
#   tcp_ports         "all" (-p-), "top:<n>" (--top-ports n) or a list "22,80,8000-8100"
#   min_rate          --min-rate (0 = nmap default)
#   max_retries       --max-retries
#   scripts           -sC (default NSE scripts) during service identification
#   version_all       --version-all (slower, more thorough version detection)
#   os_detection      -O (needs raw sockets: root or `tools nmap-caps --apply`)
#   udp_top_ports     UDP scan of the N most common ports (0 = no UDP scan; needs raw sockets)
#
# Changing these changes the modules' configuration fingerprint, so `resume` re-runs them.
version: 1

profiles:
  conservative:
    description: Low-noise checks; top 1000 TCP ports, no scripts, no UDP
    max_safety: active_safe
    nmap:
      timing: 3
      discovery_probes: ["-PE", "-PS22,80,443,445,3389", "-PA80,443"]
      tcp_ports: "top:1000"
      min_rate: 0
      max_retries: 2
      scripts: false
      version_all: false
      os_detection: false
      udp_top_ports: 0

  standard:
    description: All TCP ports, default scripts, top-20 UDP; noisy content discovery allowed
    max_safety: active_noisy
    nmap:
      timing: 4
      discovery_probes: ["-PE", "-PP", "-PS21,22,25,80,135,139,443,445,3389,5985,8080", "-PA80,443"]
      tcp_ports: all
      min_rate: 1000
      max_retries: 2
      scripts: true
      version_all: false
      os_detection: false
      udp_top_ports: 20

  comprehensive:
    description: All TCP ports, scripts, version-all, OS detection, top-100 UDP; intrusive needs approval
    max_safety: intrusive
    nmap:
      timing: 4
      discovery_probes: ["-PE", "-PP", "-PM", "-PS21,22,25,53,80,110,135,139,143,443,445,993,1433,3306,3389,5985,8080",
                         "-PA80,443", "-PU53,161"]
      tcp_ports: all
      min_rate: 1000
      max_retries: 3
      scripts: true
      version_all: true
      os_detection: true
      udp_top_ports: 100
