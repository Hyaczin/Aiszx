# Aiszx framework defaults (shipped with the code).
#
# Do not edit this file for local preferences. Put overrides in
#   ~/.config/aiszx/framework.yaml   (or $AISZX_CONFIG_DIR/framework.yaml)
# containing only the keys you want to change. Mappings merge; lists replace.
# Check the result with:  python3 pentest.py config show
version: 1

paths:
  # null → $AISZX_DATA_DIR, else $XDG_DATA_HOME/aiszx, else ~/.local/share/aiszx.
  # When set here it must be absolute or start with "~". Keep it on the VM's local
  # disk, not a VMware shared folder (SQLite locking is unreliable there).
  data_dir: null

logging:
  level: INFO             # central and per-target log files
  console_level: WARNING  # stderr; -v → INFO, -vv → DEBUG, -q → ERROR
  max_bytes: 10485760     # rotate the central log at 10 MiB
  backup_count: 5

engagements:
  default_slug: default   # used when -e/--engagement is not given

orchestrator:
  max_workers: 4            # units executed concurrently
  heartbeat_seconds: 15     # how often a running process proves it is alive
  stale_after_seconds: 300  # a run from another host is considered dead after this long without a heartbeat
  kill_grace_seconds: 5     # SIGTERM → SIGKILL delay when stopping a tool (timeout or Ctrl+C)
  default_profile: standard # see config/profiles.yaml

scope:
  resolve_hostnames: true
  # true: a hostname target is in scope only if EVERY resolved address is covered
  # by an ip/cidr include rule. Exclusions always win regardless of this setting.
  strict_hostname_resolution: true

workspace:
  dir_mode: "0750"
  protected_dir_mode: "0700"   # evidence that may contain secrets
  target_subdirs: [history, runs, consolidated, logs]
  run_subdirs:
    - scope
    - reconnaissance
    - enumeration
    - evidence
    - evidence/screenshots
    - evidence/supporting
    - evidence/protected
    - findings
    - assessment
    - logs
    - reports
  protected_subdirs: [evidence/protected]
  enumeration_categories: [http, smb, dns, ldap, ssh, ftp, other]
